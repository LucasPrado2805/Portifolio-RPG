<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RPG - Mapa Hexagonal</title>
    <link rel="stylesheet" href="rpg.css">
</head>
<body>

    <h1>Mapa do RPG</h1>
    <div id="mapa"></div>

    <div id="hud">
        <div id="foto-personagem"></div>

        <div id="painel-combate" style="display:none;">
            <h2 id="combate-nome"></h2>
            <p id="combate-vida"></p>
            <button onclick="atacar()">⚔️ Atacar</button>
        </div>

        <div id="doca">
            <div id="status">
                <div class="stat" id="nome">Herói</div>
                <div class="stat" id="vida">Vida: —</div>
                <div class="stat" id="dinheiro">Ouro: —</div>
                <div class="stat" id="nivel">Nível: —</div>
                <div class="stat" id="saldo">Movimento: —</div>
                <div class="stat" id="turno">Turno: —</div>
            </div>

            <div id="doca-baixo">
                <div id="menu">
                    <button class="btn-menu">Inventário</button>
                    <button class="btn-menu">Diário</button>
                    <button class="btn-menu" id="btn-missao" onclick="verMissao()">Missão</button>
                    <button class="btn-menu" id="btn-dado" onclick="rolarDado()">Rolar dado</button>
                </div>

                <div id="controles-mov">
                    <button class="hexbtn" onclick="mover('noroeste')">NO</button>
                    <span></span>
                    <button class="hexbtn" onclick="mover('nordeste')">NE</button>

                    <button class="hexbtn" onclick="mover('oeste')">O</button>
                    <button class="hexbtn hex-acampar" onclick="acampar()">⛺</button>
                    <button class="hexbtn" onclick="mover('leste')">L</button>

                    <button class="hexbtn" onclick="mover('sudoeste')">SO</button>
                    <span></span>
                    <button class="hexbtn" onclick="mover('sudeste')">SE</button>
                </div>

                <button id="btn-turno" onclick="encerrar()">Encerrar turno</button>
            </div>
        </div>
    </div>

    <script>

        async function atacar() {
            const r = await fetch('http://localhost:3000/atacar').then(r => r.json());

            if (r.erro) { alert(r.erro); return; }

            desenhar();

            if (r.fim === 'vitoria') {
                alert('🎲 ' + r.d20 + '! Você derrotou ' + r.nome + '!');
                document.getElementById('painel-combate').style.display = 'none';
                if (r.missao) {
                    if (r.missao.estado === 'concluida')
                        alert('✅ Missão concluída! +' + r.missao.recompensa + ' ouro');
                    else if (r.missao.estado === 'avancou')
                        alert('Objetivo cumprido! Próximo passo.');
                }
                if (r.combate) abrirCombate(r.combate);
                desenhar();
                return;
            }
            if (r.fim === 'derrota') {
                alert('🎲 ' + r.d20 + '... Você foi derrotado!');
                document.getElementById('painel-combate').style.display = 'none';
                return;
            }

            document.getElementById('combate-vida').textContent =
                'Vida: ' + r.vidaMonstro + ' | (tirou ' + r.d20 + ' no d20)';
        }

                async function verMissao() {
            const r = await fetch('http://localhost:3000/ver-missao').then(r => r.json());
            if (!r.ok) { alert('Não dá: ' + r.motivo); return; }
            desenhar();
            if (!r.missao) { alert('🎲 ' + r.d4 + ' — nenhuma missão dessa vez.'); return; }

            // EVENTO: acontece sem perguntar
            if (r.evento) {
                const resp = await fetch('http://localhost:3000/aceitar-missao/' + r.missao.id_missao).then(r => r.json());
                const perdeu = resp.missao ? resp.missao.pagou : 0;

                let msg = '🎲 ' + r.d4 + '\n\n' + r.missao.texto + '\n\n';
                if (perdeu > 0) msg += '💸 Você perdeu ' + perdeu + ' ouro.';
                else msg += '💸 Você não tinha ouro para perder.';
                alert(msg);

                if (resp.combate) abrirCombate(resp.combate);
                desenhar();
                return;
            }

            // MISSÃO NORMAL: pergunta se quer aceitar
            const aceita = confirm('🎲 ' + r.d4 + '\n\n' + r.missao.texto +
                '\n\nRecompensa: ' + r.missao.recompensa + ' ouro\n\nAceitar?');
            if (aceita) {
                const resp = await fetch('http://localhost:3000/aceitar-missao/' + r.missao.id_missao).then(r => r.json());
                alert('Missão aceita!');
                if (resp.combate) abrirCombate(resp.combate);
                desenhar();
            }
        }

        async function verificarMissoes() {
            const r = await fetch('http://localhost:3000/verificar-missoes').then(r => r.json());
            for (const res of r.resultados) {
                if (res.estado === 'concluida')
                    alert('✅ Missão concluída! +' + res.recompensa + ' ouro');
                else if (res.estado === 'avancou')
                    alert('Objetivo cumprido! Próximo passo.');
                if (res.combate) abrirCombate(res.combate);
            }
            desenhar();
        }

        function abrirCombate(monstro) {
            document.getElementById('combate-nome').textContent = monstro.nome;
            document.getElementById('combate-vida').textContent =
                'Vida: ' + monstro.vidaMonstro +
                (monstro.ataqueMonstro !== undefined ? ' | Ataque: ' + monstro.ataqueMonstro : '');
            document.getElementById('painel-combate').style.display = 'block';
        }

        async function desenhar() {
            const posicoes = await fetch('http://localhost:3000/posicoes').then(r => r.json());
            const heroi = await fetch('http://localhost:3000/personagem').then(r => r.json());
            const cidades = await fetch('http://localhost:3000/cidades').then(r => r.json());

            const ativo = await fetch('http://localhost:3000/objetivo-ativo').then(r => r.json());
            const naCidade = cidades.some(c => c.x === heroi.x && c.y === heroi.y);

            // Missão: precisa estar numa cidade, ter movimento e não estar em combate
            document.getElementById('btn-missao').disabled =
                ativo.emCombate || !naCidade || heroi.saldo_mov_turno < 1;

            // Rolar dado: precisa de um objetivo de dados ativo e não estar em combate
            document.getElementById('btn-dado').disabled =
                ativo.emCombate || !ativo.objetivo || ativo.objetivo.tipo !== 'dados';

            document.getElementById('saldo').textContent =
                'Movimento: ' + heroi.saldo_mov_turno + ' / ' + heroi.movimento_max;
            document.getElementById('turno').textContent =
                'Turno: ' + heroi.turno_atual;
            document.getElementById('vida').textContent =
                'Vida: ' + heroi.vida + ' / ' + heroi.vida_max;
            document.getElementById('dinheiro').textContent =
                'Ouro: ' + heroi.dinheiro;

            const mapa = document.getElementById('mapa');
            mapa.innerHTML = '';

            const ys = posicoes.map(p => p.y);
            const minY = Math.min(...ys), maxY = Math.max(...ys);

            for (let y = minY; y <= maxY; y++) {
                const linha = document.createElement('div');
                linha.className = 'linha';
                linha.style.marginLeft = (y * 26) + 'px';

                const casasDaLinha = posicoes
                    .filter(p => p.y === y)
                    .sort((a, b) => a.x - b.x);

                for (const pos of casasDaLinha) {
                    const hex = document.createElement('div');
                    hex.className = 'hex';

                    const cidadeAqui = cidades.find(c => c.x === pos.x && c.y === pos.y);

                    if (pos.x === heroi.x && pos.y === heroi.y) {
                        hex.className = 'hex heroi';
                        hex.textContent = '🧙';
                    } else if (cidadeAqui) {
                        hex.className = 'hex cidade';
                        hex.textContent = '🏰';
                    } else {
                        hex.textContent = pos.x + ',' + pos.y;
                    }
                    hex.style.background = pos.cor;
                    linha.appendChild(hex);
                }
                mapa.appendChild(linha);
            }
        }

        async function mover(direcao) {
            const r = await fetch('http://localhost:3000/mover/' + direcao).then(r => r.json());
            if (r.missaoPerdida) {
                alert('⏳ Você saiu do lugar enquanto esperava. Missão perdida.');
            }
            desenhar();
        }

        async function encerrar() {
            const r = await fetch('http://localhost:3000/encerrar').then(r => r.json());
            if (!r.ok) {
                alert('Não dá pra encerrar: ' + r.motivo);
                return;
            }

            desenhar();

            if (r.missao) {
                if (r.missao.estado === 'concluida')
                    alert('✅ Missão concluída! +' + r.missao.recompensa + ' ouro');
                else if (r.missao.estado === 'avancou')
                    alert('Objetivo cumprido! Próximo passo.');
            }

            if (r.combate) {
                abrirCombate(r.combate);
            } else if (r.encontro) {
                if (r.encontro.vazia) {
                    alert('Nada aconteceu: ' + r.encontro.nome);
                } else if (r.encontro.protegido) {
                    alert(r.encontro.nome + ' rondou o acampamento, mas não atacou.');
                } else {
                    abrirCombate(r.encontro);
                }
            }

            desenhar();
        }

        async function acampar() {
            const r = await fetch('http://localhost:3000/acampar').then(r => r.json());
            if (!r.ok) {
                alert('Não dá pra acampar: ' + r.motivo);
                return;
            }
            desenhar();
            alert('⛺ Acampamento montado! Passe o turno para se curar.');
        }

        async function rolarDado() {
            const r = await fetch('http://localhost:3000/rolar-dado').then(r => r.json());
            if (!r.ok) {
                alert('Não dá pra rolar: ' + r.motivo);
                return;
            }

            const regra = { fixo: 'exatamente', minimo: 'no mínimo', maximo: 'no máximo' }[r.modo];
            let msg = '🎲 d' + r.dado + ': saiu ' + r.rolagem + ' (precisava ' + regra + ' ' + r.meta + ')';

            if (!r.acertou) msg += '\nErrou. Role de novo.';
            else if (r.missao.estado === 'concluida') msg += '\n✅ Missão concluída! +' + r.missao.recompensa + ' ouro';
            else msg += '\nAcertou! Próximo objetivo.';

            alert(msg);

            if (r.combate) abrirCombate(r.combate);
            desenhar();
        }

        desenhar();

    </script>
</body>
</html>
